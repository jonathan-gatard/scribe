sonar.projectKey=scribe
sonar.projectName=Scribe
sonar.sources=custom_components/scribe,migration
sonar.tests=tests
sonar.python.version=3.13,3.14
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/__pycache__/**,venv/**,venv314/**
sonar.python.coverage.reportPaths=coverage.xml

# ---------------------------------------------------------------------------
# Rules that do not apply to this project. Each one was looked at, and is
# silenced here rather than followed, with the reason it does not fit.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=exc,hooks,secrets,ident,cancel

# S8572 asks for logging.exception() inside except blocks. Every _LOGGER.error()
# in an except here already passes exc_info=True, which is what
# logging.exception() does — the rule does not look at the argument.
sonar.issue.ignore.multicriteria.exc.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.exc.resourceKey=**/*.py

# S7503 flags async functions that never await. The ones reported are Home
# Assistant platform hooks (async_setup, async_setup_entry, diagnostics):
# their signature is dictated by the framework, which awaits them.
sonar.issue.ignore.multicriteria.hooks.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.hooks.resourceKey=custom_components/scribe/*.py

# S6698 reports the example connection URLs shown in the config-flow help text
# ("postgresql://scribe:secret@192.168.1.10:5432/scribe"). They are placeholders
# in translated UI strings, not credentials.
sonar.issue.ignore.multicriteria.secrets.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.secrets.resourceKey=custom_components/scribe/**/*.json

# S6353 suggests \w instead of [A-Za-z0-9_] in _validate_table_name. \w matches
# Unicode letters in Python, so following it would widen an allowlist that
# exists to keep identifiers out of SQL injection range. Deliberately explicit.
sonar.issue.ignore.multicriteria.ident.ruleKey=python:S6353
sonar.issue.ignore.multicriteria.ident.resourceKey=custom_components/scribe/writer.py

# S7497 wants CancelledError re-raised after cleanup. In writer.stop() the
# cancellation is the one Scribe itself just requested on the task it is
# awaiting; re-raising would abort Home Assistant's unload. Explained in place.
sonar.issue.ignore.multicriteria.cancel.ruleKey=python:S7497
sonar.issue.ignore.multicriteria.cancel.resourceKey=custom_components/scribe/writer.py
