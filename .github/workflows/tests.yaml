name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # Lets release.yaml run this workflow as a gating job before publishing.
  workflow_call:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    # Real TimescaleDB for tests/test_rename_integration.py. Without it those
    # tests skip themselves, and the rename paths are only covered by mocks —
    # which is how a primary-key violation in the history merge reached a beta.
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: scribe
          POSTGRES_DB: scribe
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install -r requirements_test.txt
          
      - name: Lint with ruff
        # ruff is pinned in requirements_test.txt: an unpinned linter on the
        # release gate means any ruff release can block publishing at random.
        run: |
          ruff check .
          
      - name: Test with pytest
        env:
          SCRIBE_TEST_DSN: postgresql://postgres:scribe@127.0.0.1:55432/scribe
        run: |
          pytest tests

      - name: Verify integration tests actually ran
        # They skip silently when no database answers; without this check a
        # broken service container would quietly reduce coverage to mocks.
        env:
          SCRIBE_TEST_DSN: postgresql://postgres:scribe@127.0.0.1:55432/scribe
        run: |
          pytest tests/integration -q --no-header -p no:cacheprovider \
            | tee /tmp/integration.txt
          if grep -q "skipped" /tmp/integration.txt; then
            echo "::error::Integration tests skipped — the TimescaleDB service is unreachable."
            exit 1
          fi
