name: CodeQL

# GitHub's own static analysis. Free on public repositories, needs no account
# or token, and reports into the Security tab rather than as CI noise.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Rules are updated continuously; a weekly pass catches findings that did
    # not exist when the code was last touched.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
